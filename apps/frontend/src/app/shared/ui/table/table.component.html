<table class="min-w-full text-black">
  <thead>
      <tr>
        @for(col of colunas; track col.campo){
          <th>{{col.textoCabecalho}}</th>
        }
        <th>Editar</th>
        @if(detalhes.observers.length > 0){
          <th>Detalhes</th>
        }
      </tr>
  </thead>
  <tbody >
    @for(row of dados; track row.id){
      <tr>
        @for(col of colunas; track col.campo){
          <td>{{row[col.campo]}}</td>
        }
        <td>
          <button type="button" class="p-3 bg-amber-200" (click)="onEditarClick(row)">Editar</button>
        </td>
        @if(detalhes.observers.length > 0){
          <td>
            <button type="button" class="p-3 bg-blue-200" (click)="onDetalhesClick(row)">Detalhes</button>
          </td>
        }
        </tr>
    } @empty {
      <tr>
        <td [attr.colspan]="colunas.length + 1">
          Nenhum registro encontrado.
        </td>
      </tr>
    }
  </tbody>
</table>
